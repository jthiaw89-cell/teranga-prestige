<!doctype html>
<html lang="fr" class="light">
  <head>
    <script>
      (function() {
        function makeWritable(target, prop) {
          try {
            var desc = Object.getOwnPropertyDescriptor(target, prop);
            if (!desc || desc.configurable) {
              var val = target[prop];
              Object.defineProperty(target, prop, {
                configurable: true,
                enumerable: true,
                get: function() { return val; },
                set: function(newVal) { val = newVal; }
              });
            }
          } catch (e) {}
        }
        makeWritable(window, 'fetch');
        makeWritable(window, 'XMLHttpRequest');
        try {
          if (typeof Window !== 'undefined' && Window.prototype) {
            makeWritable(Window.prototype, 'fetch');
            makeWritable(Window.prototype, 'XMLHttpRequest');
          }
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && (
              event.message.indexOf('Cannot set property fetch') !== -1 ||
              event.message.indexOf('frame_ant') !== -1
            ))
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);
      })();
    </script>
